<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WINAMP Spotify</title>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<style>
:root{--w:100%;--panel:#292a45;--panel2:#202139;--edge:#0b0c12;--hi:#76788f;--green:#19ff00;--yellow:#ffe600;--white:#e9eef2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#050505;color:#ddd;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
body{display:flex;justify-content:center;padding:10px 0 24px}
#app{width:min(100%,600px);max-width:600px}
/* One responsive Winamp canvas. No transform scaling, no independent zooming. */
.win{width:100%;background:var(--panel);border:2px solid #0a0b11;box-shadow:inset 0 0 0 1px #77798e,0 0 0 1px #000;margin:0 0 3px;overflow:hidden}
.title{height:clamp(29px,5.6vw,34px);display:flex;align-items:center;padding:0 7px;background:linear-gradient(#66687c,#36374f 45%,#24253a 47%,#303148);border-bottom:2px solid #0d0e16;white-space:nowrap}
.gold{height:5px;flex:1;min-width:12px;margin:0 9px;border:1px solid #171717;background:linear-gradient(#fff7aa 0 30%,#d1af2f 31% 65%,#5f4b00 66%);box-shadow:0 0 0 1px #8b8d9a}
.brand{font-weight:900;font-size:clamp(16px,4.1vw,23px);letter-spacing:.5px;color:#eee;text-shadow:2px 2px #171722}
.winbtn{width:clamp(25px,5.4vw,31px);height:clamp(24px,5vw,29px);margin-left:4px;border:1px solid #161724;background:linear-gradient(#60627a,#292a42);color:#ffe100;font:bold clamp(14px,3.4vw,19px)/1 Arial;box-shadow:inset 1px 1px #8d8fa1,1px 1px #0a0a10;padding:0}
.winbtn:active,.button:active{filter:brightness(.78);transform:translate(1px,1px)}
/* PLAYER */
.player-body{padding:8px;display:grid;grid-template-columns:36% 64%;background:linear-gradient(#2a2b46,#22233a);min-height:clamp(205px,42vw,252px);position:relative}
.leftcol{padding-right:6px}.rightcol{padding-left:4px}
.display{height:clamp(91px,18.5vw,111px);background:#000;border:3px solid #0a0b0d;box-shadow:inset 0 0 0 2px #343541;position:relative;overflow:hidden;color:var(--green);font-family:monospace}
.display:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,255,0,.025) 4px);pointer-events:none}
.digit-label{position:absolute;left:7px;top:4px;font:bold clamp(10px,2vw,12px) monospace;line-height:16px;color:#14d500}
.mini-title{position:absolute;left:39px;top:4px;font:bold clamp(9px,2vw,12px) monospace;color:#12d900;white-space:nowrap;max-width:54%;overflow:hidden}
.bigtime{position:absolute;left:0;right:0;top:5px;text-align:center;font:bold clamp(29px,7vw,43px)/1 monospace;color:#24ff00;text-shadow:0 0 6px #0f0}
.meter{position:absolute;left:7px;right:7px;bottom:20px;height:32%;display:flex;align-items:flex-end;gap:2px}
.meter i{flex:1;min-width:2px;background:linear-gradient(to top,#10a800 0 48%,#9bff00 49% 72%,#ffd400 73% 86%,#ff6b00 87%);height:25%;box-shadow:0 0 2px #0f0}
.mode{position:absolute;left:7px;right:7px;bottom:3px;display:flex;justify-content:space-between;font:bold clamp(8px,1.8vw,11px) monospace;color:#15d800}
.track{height:clamp(34px,7.5vw,45px);background:#000;border:3px solid #08090d;box-shadow:inset 0 0 0 1px #40404c;color:#19ff00;font:bold clamp(13px,3.3vw,19px) monospace;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{height:35px;display:flex;align-items:center;gap:7px;font:bold clamp(10px,2.4vw,14px) monospace;color:#cfcfd2;white-space:nowrap}
.badge{background:#071000;border:2px solid #168b00;color:#20ff00;padding:3px 5px;font:bold clamp(12px,2.9vw,17px) monospace}
.greenword{color:#1cff00}
.seek{height:14px;background:#070707;border:2px inset #85869a;position:relative;margin:4px 0;touch-action:none}
.seek-fill{height:100%;width:0;background:linear-gradient(90deg,#ff7b10,#ffb01c)}
.seek-knob{position:absolute;top:-5px;left:0;width:29px;height:24px;transform:translateX(-50%);background:linear-gradient(#fff9ce,#d0b54b);border:2px solid #646572;box-shadow:inset 0 0 0 1px #fff}
.mini-controls{display:flex;justify-content:flex-end;gap:5px;margin-top:2px;flex-wrap:nowrap}.mini-controls #skin{min-width:46px}
.smallbutton{height:25px;min-width:42px;border:2px solid #6b747d;border-top-color:#f6f9fb;border-left-color:#f6f9fb;background:linear-gradient(#f4f8fa,#bcc8d2 50%,#e0e7eb);color:#303946;font:bold clamp(10px,2.4vw,13px) Arial;box-shadow:2px 2px #05060a;padding:0 8px}
.transport{grid-column:1/3;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:9px}
.button{height:clamp(39px,9vw,52px);border:2px solid #68727b;border-top-color:#f8fafb;border-left-color:#f8fafb;background:linear-gradient(#f5f9fb,#bcc8d2 48%,#e0e8ec);color:#1d2731;box-shadow:2px 2px 0 #05060a,inset 0 0 0 1px #87919a;display:flex;align-items:center;justify-content:center;padding:0;font-weight:900}
.icon{font-size:clamp(19px,5vw,30px);line-height:1}
.playicon{font-size:clamp(22px,5.6vw,32px)}
.player-bottom{padding:8px;display:flex;align-items:center;gap:6px;background:#22233a;min-height:47px}
.toggle{height:34px;padding:0 11px}.volume-label{font:bold 12px Arial;color:#bbb}.volume{flex:1;min-width:65px;max-width:150px;accent-color:#f28b1d}
/* EQUALIZER */
.eq-body{padding:9px;background:linear-gradient(#2a2b46,#24253d);min-height:clamp(175px,40vw,235px)}
.eq-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}.eq-actions{display:flex;gap:5px}
.eq-area{position:relative;height:clamp(135px,31vw,185px);padding:5px 7px 0}
.eq-grid{height:100%;display:grid;grid-template-columns:repeat(11,1fr);gap:1.5%;align-items:end}
.eqcell{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.eqtrack{position:relative;width:100%;height:calc(100% - 25px);min-height:90px}
.rail{position:absolute;left:50%;top:8px;bottom:9px;width:6px;transform:translateX(-50%);background:#101116;border:1px solid #5a5d6b}
.rail:after{content:"";position:absolute;left:1px;right:1px;top:2px;bottom:2px;background:#ffe000;box-shadow:0 0 4px #ffd500}
.eqrange{position:absolute;left:50%;top:50%;width:100%;height:23px;transform:translate(-50%,-50%) rotate(-90deg);appearance:none;-webkit-appearance:none;background:transparent;margin:0;z-index:3;touch-action:none}
.eqrange::-webkit-slider-runnable-track{height:5px;background:transparent}.eqrange::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:linear-gradient(#f6fafc,#aebac4);border:2px solid #3a424a;box-shadow:inset 1px 1px #fff,2px 2px #111;margin-top:-9px}
.eqrange::-moz-range-track{height:5px;background:transparent}.eqrange::-moz-range-thumb{width:20px;height:20px;background:linear-gradient(#f6fafc,#aebac4);border:2px solid #3a424a;box-shadow:inset 1px 1px #fff,2px 2px #111}
.eqname{font:bold clamp(8px,2vw,12px) monospace;color:#eee;height:20px;white-space:nowrap}
.dbmarks{position:absolute;left:4px;top:28%;display:flex;flex-direction:column;gap:clamp(25px,6vw,39px);font:bold clamp(9px,2vw,12px) monospace;color:#eee}.dbmarks b{color:#eee}
/* PLAYLIST */
.pl-body{padding:8px;background:linear-gradient(#2a2b46,#24253d)}
.playlist{height:clamp(250px,58vw,350px);background:#000;border:3px solid #111;box-shadow:inset 0 0 0 2px #343541;overflow-y:auto;overflow-x:hidden;font:clamp(13px,3.6vw,19px)/1.55 monospace;color:#18ff00;padding:5px 8px}
.song{display:grid;grid-template-columns:1fr auto;gap:6px;white-space:nowrap;padding:0 2px;border:1px solid transparent}.song.active{color:#fff}.song:active{background:#202020}.song span:first-child{overflow:hidden;text-overflow:ellipsis}.song{cursor:pointer}
.pl-bottom{display:grid;grid-template-columns:auto auto auto auto 1fr auto;gap:5px;align-items:center;margin-top:7px}.pltime{background:#000;border:2px solid #0b0b0d;color:#20ff00;font:bold clamp(11px,2.6vw,15px) monospace;padding:4px 5px;min-width:120px;text-align:center}.listopts{height:38px}
.tiny-transport{display:flex;gap:4px;justify-content:center;color:#ffe000;font:bold 18px monospace}
/* search */
.searchbox{display:flex;padding:7px;background:#101018;border:2px solid #55576a;margin-top:7px}.searchbox.show{display:flex;gap:5px}.searchbox input{flex:1;min-width:0;background:#000;border:2px inset #777;color:#20ff00;font:14px monospace;padding:6px}.searchbox button{height:32px}.playlist-menu{display:none;background:#000;border:2px solid #77798f;margin-top:7px;padding:6px;color:#20ff00;font:14px monospace}.playlist-menu.show{display:block}.playlist-menu-head{display:flex;justify-content:space-between;align-items:center;color:#ffe600;margin-bottom:5px}.playlist-choice{display:block;width:100%;text-align:left;background:#000;color:#20ff00;border:0;border-bottom:1px solid #202020;padding:7px 4px;font:14px monospace}.playlist-choice:active{background:#222}.playlist-loading{color:#aaa;padding:7px}
.hidden{display:none!important}.collapsed .body,.collapsed .player-bottom,.collapsed .pl-body{display:none!important}

/* FUSION SKIN */
body.fusion{background:#020202;color:#ddd}
body.fusion #app{filter:none}
.fusion .win{background:linear-gradient(#303030,#171717 55%,#0d0d0d);border:2px solid #050505;box-shadow:inset 0 0 0 1px #777,0 0 0 1px #000,0 0 14px rgba(255,110,0,.08)}
.fusion .title{background:linear-gradient(#3e3e3e,#1a1a1a 48%,#0b0b0b 50%,#242424);border-bottom:2px solid #050505;height:clamp(31px,5.8vw,36px)}
.fusion .gold{background:linear-gradient(#ffd0a0 0 28%,#ff7414 29% 67%,#4b1800 68%);border-color:#160b05;box-shadow:0 0 0 1px #7a3a16,0 0 5px rgba(255,100,0,.25)}
.fusion .brand{font-family:monospace;font-size:clamp(15px,3.7vw,21px);letter-spacing:1px;color:#ff8a24;text-shadow:0 0 6px rgba(255,110,0,.45),2px 2px #000}
.fusion #playerWin .brand{font-size:0}.fusion #playerWin .brand:after{content:'WINAMP SPOTIFY';font-size:clamp(15px,3.7vw,21px)}
.fusion #eqWin .brand{font-size:0}.fusion #eqWin .brand:after{content:'FUSION';font-size:clamp(15px,3.7vw,21px)}
.fusion #plWin .brand{font-size:0}.fusion #plWin .brand:after{content:'AMP DECK';font-size:clamp(15px,3.7vw,21px)}
.fusion .winbtn{background:linear-gradient(#414141,#151515);color:#ff8a24;border-color:#090909;box-shadow:inset 1px 1px #666,1px 1px #000}
.fusion .player-body,.fusion .player-bottom,.fusion .eq-body,.fusion .pl-body{background:linear-gradient(135deg,#292929,#111 55%,#202020);color:#ddd}
.fusion .display,.fusion .track,.fusion .playlist,.fusion .pltime{background:#030303;border-color:#111;box-shadow:inset 0 0 0 2px #292929,0 0 7px rgba(255,110,0,.06)}
.fusion .display{color:#ff8a24}.fusion .display:after{background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,115,20,.035) 4px)}
.fusion .digit-label,.fusion .mini-title,.fusion .bigtime,.fusion .mode,.fusion .track,.fusion .playlist,.fusion .pltime,.fusion .greenword{color:#ff8a24;text-shadow:0 0 5px rgba(255,110,0,.2)}
.fusion .meter i{background:linear-gradient(to top,#9d2f00 0 48%,#ff6b00 49% 72%,#ffad27 73% 86%,#ffe1a6 87%);box-shadow:0 0 3px #ff6b00}
.fusion .badge{background:#160a02;border-color:#9a430c;color:#ff8a24}
.fusion .seek{background:#050505;border-color:#555}.fusion .seek-fill{background:linear-gradient(90deg,#9f2f00,#ff8a24,#ffd06a)}
.fusion .seek-knob{background:linear-gradient(#ffe0ad,#bd5c15);border-color:#542b10;box-shadow:inset 0 0 0 1px #fff1d0,0 0 4px rgba(255,100,0,.25)}
.fusion .button,.fusion .smallbutton{background:linear-gradient(#454545,#1d1d1d 52%,#303030);color:#e6e6e6;border-color:#111;border-top-color:#777;border-left-color:#777;box-shadow:2px 2px #050505,inset 0 0 0 1px #555}
.fusion .button:active,.fusion .smallbutton:active,.fusion .button.active,.fusion .smallbutton.active{color:#ff9a3d;border-color:#8a3b0c;box-shadow:inset 0 0 7px rgba(255,90,0,.22),2px 2px #050505}
.fusion .volume{accent-color:#ff7b19}
.fusion .eq-area{background:linear-gradient(180deg,rgba(255,105,10,.025),transparent);border-top:1px solid #393939}
.fusion .rail{background:#090909;border-color:#4b4b4b}.fusion .rail:after{background:#a83b08;box-shadow:0 0 5px #ff6b00}
.fusion .eqrange::-webkit-slider-thumb{width:17px;height:17px;background:linear-gradient(#d8d8d8,#6e6e6e);border-color:#242424;box-shadow:inset 1px 1px #fff,0 0 4px rgba(255,105,0,.25)}
.fusion .eqrange::-moz-range-thumb{width:17px;height:17px;background:linear-gradient(#d8d8d8,#6e6e6e);border-color:#242424;box-shadow:inset 1px 1px #fff,0 0 4px rgba(255,105,0,.25)}
.fusion .eqname,.fusion .dbmarks{color:#bcbcbc}.fusion .dbmarks b{color:#ff8a24}
.fusion .playlist .song.active{color:#fff}.fusion .playlist .song:active{background:#1b120c}
.fusion .searchbox,.fusion .playlist-menu{background:#111;border-color:#444}.fusion .searchbox input,.fusion .playlist-choice{background:#030303;color:#ff8a24;border-color:#333}
.fusion .tiny-transport{color:#ff8a24}

@media(max-width:360px){.player-body{grid-template-columns:35% 65%}.gold{margin:0 5px}.player-bottom{gap:3px}.smallbutton{padding:0 5px}.playlist{font-size:12px}}


/* ===== FIVE ADDITIONAL VISUAL SKINS =====
   These rules only change appearance. Spotify/auth/playback JavaScript is shared. */
body.skin-classicblue{--sk-bg:#05070b;--sk-panel:#aeb8c8;--sk-panel2:#d6dde6;--sk-edge:#4d596b;--sk-hi:#fff;--sk-text:#172438;--sk-accent:#173c78;--sk-display:#173c78;--sk-displaytext:#fff;--sk-button:#dce3ea;--sk-buttontext:#172438;--sk-glow:none}
body.skin-sony{--sk-bg:#101010;--sk-panel:#d9d9d9;--sk-panel2:#f4f4f4;--sk-edge:#777;--sk-hi:#fff;--sk-text:#222;--sk-accent:#333;--sk-display:#050505;--sk-displaytext:#d7c0b0;--sk-button:#bdbdbd;--sk-buttontext:#222;--sk-glow:none}
body.skin-onegin{--sk-bg:#000;--sk-panel:#000;--sk-panel2:#000;--sk-edge:#168416;--sk-hi:#27ff27;--sk-text:#27ff27;--sk-accent:#000;--sk-display:#000;--sk-displaytext:#27ff27;--sk-button:#000;--sk-buttontext:#27ff27;--sk-glow:0 0 5px rgba(0,255,0,.25)}
body.skin-blue{--sk-bg:#000;--sk-panel:#707070;--sk-panel2:#111;--sk-edge:#555;--sk-hi:#fff;--sk-text:#008cff;--sk-accent:#000;--sk-display:#000;--sk-displaytext:#008cff;--sk-button:#aaa;--sk-buttontext:#111;--sk-glow:0 0 5px rgba(0,120,255,.25)}
body.skin-neon{--sk-bg:#050008;--sk-panel:#08080d;--sk-panel2:#050509;--sk-edge:#2700ff;--sk-hi:#00cfff;--sk-text:#00cfff;--sk-accent:#000;--sk-display:#000;--sk-displaytext:#00cfff;--sk-button:#161620;--sk-buttontext:#00cfff;--sk-glow:0 0 7px rgba(255,0,212,.3)}

body.skin-classicblue,body.skin-sony,body.skin-onegin,body.skin-blue,body.skin-neon{background:var(--sk-bg);color:var(--sk-text)}
body.skin-classicblue .win,body.skin-sony .win,body.skin-onegin .win,body.skin-blue .win,body.skin-neon .win{background:var(--sk-panel);border-color:var(--sk-edge);box-shadow:inset 0 0 0 1px var(--sk-hi),0 0 0 1px #000,var(--sk-glow)}
body.skin-classicblue .title,body.skin-sony .title,body.skin-onegin .title,body.skin-blue .title,body.skin-neon .title{background:linear-gradient(var(--sk-panel2),var(--sk-panel));border-bottom-color:var(--sk-edge)}
body.skin-classicblue .gold,body.skin-sony .gold,body.skin-onegin .gold,body.skin-blue .gold,body.skin-neon .gold{background:var(--sk-accent);border-color:var(--sk-edge);box-shadow:var(--sk-glow)}
body.skin-classicblue .brand,body.skin-sony .brand,body.skin-onegin .brand,body.skin-blue .brand,body.skin-neon .brand{font-family:monospace;color:var(--sk-text);text-shadow:var(--sk-glow);letter-spacing:1px}
body.skin-classicblue .winbtn,body.skin-sony .winbtn,body.skin-onegin .winbtn,body.skin-blue .winbtn,body.skin-neon .winbtn{background:linear-gradient(var(--sk-hi),var(--sk-panel));color:var(--sk-text);border-color:var(--sk-edge);box-shadow:inset 1px 1px var(--sk-hi),1px 1px #222}
body.skin-classicblue .player-body,body.skin-classicblue .player-bottom,body.skin-classicblue .eq-body,body.skin-classicblue .pl-body,body.skin-sony .player-body,body.skin-sony .player-bottom,body.skin-sony .eq-body,body.skin-sony .pl-body,body.skin-onegin .player-body,body.skin-onegin .player-bottom,body.skin-onegin .eq-body,body.skin-onegin .pl-body,body.skin-blue .player-body,body.skin-blue .player-bottom,body.skin-blue .eq-body,body.skin-blue .pl-body,body.skin-neon .player-body,body.skin-neon .player-bottom,body.skin-neon .eq-body,body.skin-neon .pl-body{background:var(--sk-panel2);color:var(--sk-text)}
body.skin-classicblue .display,body.skin-classicblue .track,body.skin-classicblue .playlist,body.skin-classicblue .pltime,body.skin-sony .display,body.skin-sony .track,body.skin-sony .playlist,body.skin-sony .pltime,body.skin-onegin .display,body.skin-onegin .track,body.skin-onegin .playlist,body.skin-onegin .pltime,body.skin-blue .display,body.skin-blue .track,body.skin-blue .playlist,body.skin-blue .pltime,body.skin-neon .display,body.skin-neon .track,body.skin-neon .playlist,body.skin-neon .pltime{background:var(--sk-display);color:var(--sk-displaytext);border-color:var(--sk-edge);box-shadow:inset 0 0 0 2px var(--sk-edge),var(--sk-glow)}
body.skin-classicblue .digit-label,body.skin-classicblue .mini-title,body.skin-classicblue .bigtime,body.skin-classicblue .mode,body.skin-classicblue .track,body.skin-classicblue .playlist,body.skin-classicblue .pltime,body.skin-classicblue .greenword,body.skin-sony .digit-label,body.skin-sony .mini-title,body.skin-sony .bigtime,body.skin-sony .mode,body.skin-sony .track,body.skin-sony .playlist,body.skin-sony .pltime,body.skin-sony .greenword,body.skin-onegin .digit-label,body.skin-onegin .mini-title,body.skin-onegin .bigtime,body.skin-onegin .mode,body.skin-onegin .track,body.skin-onegin .playlist,body.skin-onegin .pltime,body.skin-onegin .greenword,body.skin-blue .digit-label,body.skin-blue .mini-title,body.skin-blue .bigtime,body.skin-blue .mode,body.skin-blue .track,body.skin-blue .playlist,body.skin-blue .pltime,body.skin-blue .greenword,body.skin-neon .digit-label,body.skin-neon .mini-title,body.skin-neon .bigtime,body.skin-neon .mode,body.skin-neon .track,body.skin-neon .playlist,body.skin-neon .pltime,body.skin-neon .greenword{color:var(--sk-displaytext);text-shadow:var(--sk-glow)}
body.skin-classicblue .meter i{background:linear-gradient(to top,#59c7ff,#fff);box-shadow:0 0 2px #8bdcff}body.skin-sony .meter i{background:linear-gradient(to top,#777,#eee);box-shadow:none}body.skin-onegin .meter i{background:#20d920;box-shadow:0 0 3px #0f0}body.skin-blue .meter i{background:#00bfff;box-shadow:0 0 3px #008cff}body.skin-neon .meter i{background:linear-gradient(to top,#5400ff,#ff00d4,#00d8ff);box-shadow:0 0 4px #ff00d4}
body.skin-classicblue .badge,body.skin-sony .badge,body.skin-onegin .badge,body.skin-blue .badge,body.skin-neon .badge{background:var(--sk-display);border-color:var(--sk-edge);color:var(--sk-displaytext)}
body.skin-classicblue .seek,body.skin-sony .seek,body.skin-onegin .seek,body.skin-blue .seek,body.skin-neon .seek{background:var(--sk-display);border-color:var(--sk-edge)}
body.skin-classicblue .seek-fill{background:#8fd7ff}body.skin-sony .seek-fill{background:#ccc}body.skin-onegin .seek-fill{background:#20d920}body.skin-blue .seek-fill{background:#008cff}body.skin-neon .seek-fill{background:linear-gradient(90deg,#ff00d4,#00d8ff)}
body.skin-classicblue .seek-knob,body.skin-sony .seek-knob,body.skin-blue .seek-knob{background:linear-gradient(#fff,#bbb);border-color:var(--sk-edge)}body.skin-onegin .seek-knob{background:#000;border-color:#27ff27;box-shadow:none}body.skin-neon .seek-knob{background:#ddd;border-color:#ff00d4;box-shadow:0 0 6px #ff00d4}

<script>

const songs=[
 ['Mori Calliope','Go-Getters','3:15','',Date.now()-6000],['CircusP','Goodbye','3:24','',Date.now()-5000],['AmaLee','Siren','4:02','',Date.now()-4000],['Crusher-P','Echo','3:50','',Date.now()-3000],['M83','Midnight City','4:03','',Date.now()-2000],['Sunnexo','Please Wait','4:15','',Date.now()-1000],['Omaru Polka','Persona','4:56','',Date.now()]
];
function status(t){}
function b64(a){return btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function rnd(n=64){let a=new Uint8Array(n);crypto.getRandomValues(a);return b64(a)}
async function sha(s){return b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))}
function renderPlaylist(){
 $('playlist').innerHTML=songs.map((s,i)=>`<div class="song ${i===current?'active':''}" data-i="${i}"><span>${i+1}. ${esc(s[0])} - ${esc(s[1])}</span><span>${s[2]}</span></div>`).join('');
 [...$('playlist').children].forEach(x=>x.onclick=()=>playIndex(+x.dataset.i));
 $('sort').textContent=sortMode==='added'?'SORT: NYLIG':'SORT: ARTIST';
}
function sortPlaylist(){
 if(songs.length<2)return;
 const currentUri=songs[current]?.[3]||'';
 sortMode=sortMode==='added'?'artist':'added';
 songs.sort((a,b)=>sortMode==='artist' ? String(a[0]).localeCompare(String(b[0]),'nb',{sensitivity:'base'}) : ((b[4]||0)-(a[4]||0)));
 const idx=songs.findIndex(x=>currentUri && x[3]===currentUri);
 if(idx>=0)current=idx; else current=Math.min(current,songs.length-1);
 renderPlaylist();
 status(sortMode==='added'?'Sortert: nylig lagt til':'Sortert: artist');
}

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
songs.sort((a,b)=>(b[4]||0)-(a[4]||0));

$('meter').innerHTML=Array.from({length:18},(_,i)=>`<i style="height:${18+(i*13)%75}%"></i>`).join('');
setInterval(()=>{if(!playing)return;document.querySelectorAll('#meter i').forEach((b,i)=>b.style.height=(20+Math.random()*75)+'%')},180);
const bands=['PREAMP','70','180','320','600','1K','3K','6K','12K','14K','16K'];
$('eqGrid').innerHTML=bands.map((b,i)=>`<div class="eqcell"><div class="eqtrack"><div class="rail"></div><input class="eqrange" data-band="${i}" type="range" min="-12" max="12" value="0"></div><div class="eqname">${b}</div></div>`).join('');

try{
 let v=JSON.parse(localStorage.getItem('wa_eq')||'[]');
 const defaults=[7,5,3,1,-1,-2,-1,1,3,5,7];
 document.querySelectorAll('.eqrange').forEach((x,i)=>{x.value=v[i]!=null?v[i]:defaults[i]});
}catch(e){document.querySelectorAll('.eqrange').forEach((x,i)=>x.value=[7,5,3,1,-1,-2,-1,1,3,5,7][i])}
$('eqGrid').addEventListener('input',saveEq);
async function refresh(){if(!refreshToken)return false;try{let r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:refreshToken,client_id:CLIENT_ID})});let d=await r.json();if(!r.ok)throw Error(d.error||'refresh failed');token=d.access_token;expiresAt=Date.now()+d.expires_in*1000;localStorage.setItem('wa_token',token);localStorage.setItem('wa_exp',expiresAt);if(d.refresh_token){refreshToken=d.refresh_token;localStorage.setItem('wa_refresh',refreshToken)}return true}catch(e){localStorage.removeItem('wa_token');localStorage.removeItem('wa_exp');return false}}

async function callback(){let p=new URLSearchParams(location.search),code=p.get('code'),state=p.get('state');if(!code)return; if(state!==localStorage.getItem('wa_state')){status('Spotify: OAuth-feil');return}let verifier=localStorage.getItem('wa_verifier');let r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT,code_verifier:verifier})});let d=await r.json();if(!r.ok){status('Spotify-innlogging feilet');return}token=d.access_token;refreshToken=d.refresh_token||'';expiresAt=Date.now()+d.expires_in*1000;localStorage.setItem('wa_token',token);localStorage.setItem('wa_exp',expiresAt);if(refreshToken)localStorage.setItem('wa_refresh',refreshToken);history.replaceState({},'',location.pathname);status('Spotify tilkoblet');startPlayer()}
async function api(path,opt={}){if(!await ensure())throw Error('not logged in');let r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token}});if(r.status===401&&await refresh())return api(path,opt);if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}

function drawClock(pos,dur){
 clockBase=Math.max(0,Math.min(pos||0,dur||Infinity));

}
function updateClock(){
 let pos=clockBase;
 if(playing)pos=Math.min(lastDuration||Infinity,clockBase+(performance.now()-clockStartedAt));
 const pc=lastDuration?Math.max(0,Math.min(1,pos/lastDuration)):0;
 $('seekFill').style.width=(pc*100)+'%';$('seekKnob').style.left=(pc*100)+'%';$('time').textContent=fmt(pos);$('pltime').textContent=fmt(pos)+'/'+fmt(lastDuration);
}
function startClock(){if(clockTimer)return;const tick=()=>{updateClock();clockTimer=requestAnimationFrame(tick)};clockTimer=requestAnimationFrame(tick)}

async function pollState(){
 if(!player||!token)return;
 try{
   const s=await player.getCurrentState();

function applyPlayerState(s){
 const t=s.track_window?.current_track;
 if(!t)return;

 if(idx>=0 && idx!==current)current=idx;

 $('playIcon').textContent=playing?'▶':'▶';

async function advanceAtEnd(s){

 try{

   try{await api('/me/player',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_ids:[deviceId],play:false})})}catch(e){}
   try{let st=await player.getCurrentState();if(st)applyPlayerState(st)}catch(e){};try{let v=await player.getVolume();if(v>=0&&v<=1)$('volume').value=v}catch(e){}
 });
 player.addListener('not_ready',()=>{status('Spotify-enheten mistet tilkoblingen');scheduleReconnect()});
 player.addListener('player_state_changed',s=>{if(!s)return;applyPlayerState(s);advanceAtEnd(s)});
 player.addListener('autoplay_failed',()=>status('Trykk PLAY for å starte lyd på iPhone'));
 player.addListener('playback_error',e=>status('Spotify avspillingsfeil: '+(e.message||'')));
 player.addListener('authentication_error',()=>{status('Spotify-autorisering utløpt');scheduleReconnect()});
 player.addListener('initialization_error',e=>status('Spotify: '+(e.message||'initialiseringsfeil')));
 player.addListener('account_error',e=>status('Spotify-kontoen kan ikke bruke Web Playback SDK'));
 player.connect();
}
setInterval(()=>{if(playing)pollState()},500);
startClock();
window.addEventListener('pageshow',scheduleReconnect);
window.addEventListener('focus',scheduleReconnect);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){scheduleReconnect();pollState()}});

function fmt(ms){let s=Math.floor((ms||0)/1000),m=Math.floor(s/60),q=String(s%60).padStart(2,'0');return m+':'+q}
async function activate(){if(player?.activateElement)try{await player.activateElement()}catch(e){}}
async function playOnly(){
 if(!player){status('Kobler til Spotify...');await connect();if(!player)return}
 await activate();
 try{await player.resume();playing=true;clockStartedAt=performance.now()-clockBase}catch(e){try{await api('/me/player/play',{method:'PUT',headers:{'Content-Type':'application/json', ...(deviceId?{}:{})}})}catch(x){status('Trykk CONNECT SPOTIFY først')}}
}
async function resolveSong(i){
 let uri=songs[i]?.[3];
 if(uri)return uri;
 let q=encodeURIComponent('track:'+songs[i][1]+' artist:'+songs[i][0]);
 let r=await api('/search?type=track&limit=1&market=NO&q='+q);
 let t=r.tracks.items[0];
 if(!t)throw Error('Fant ikke låten i Spotify');
 uri=t.uri;songs[i][3]=uri;return uri;
}
async function resolveAllSongs(){for(let i=0;i<songs.length;i++)await resolveSong(i)}
async function playIndex(i){
 if(!songs.length)return;
 current=Math.max(0,Math.min(i,songs.length-1));renderPlaylist();
 $('trackTitle').textContent=(current+1)+'. '+songs[current][0]+' - '+songs[current][1]+' ('+songs[current][2]+')';
 if(!player){await connect();if(!player)return}
 await activate();
 try{
   // Start the selected track directly by URI. This reliably changes the song
   // even when another track is already playing, including on iPhone/iPad.
   const uri=await resolveSong(current);
   const body={uris:[uri]};
   if(deviceId)body.device_id=deviceId;
   await api('/me/player/play',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
   playing=true;drawClock(0,parseTime(songs[current][2]));status('Spiller '+songs[current][0]+' - '+songs[current][1]);
 }catch(e){status('Spotify: '+friendlySpotifyError(e.message))}
}
function parseTime(t){let p=String(t||'0:00').split(':').map(Number);return ((p[p.length-2]||0)*60+(p[p.length-1]||0))*1000}
async function connect(){
 if(!await ensure()){await login();return}
 if(!player)startPlayer();
 if(player){await activate();scheduleReconnect();status('Spotify tilkoblet • trykk PLAY eller en låt')}
}
async function nextTrack(){
 if(!songs.length)return;
 const next=shuffle ? (()=>{let n=current;while(songs.length>1&&n===current)n=Math.floor(Math.random()*songs.length);return n})() : (current+1)%songs.length;
 await playIndex(next);
}
async function previousTrack(){
 if(!songs.length)return;
 if(!player){await connect();if(!player)return}
 await activate();
 try{
   const st=await player.getCurrentState();
   if(st&&st.position>3000){await player.seek(0);drawClock(0,st.duration);return}
 }catch(e){}
 await playIndex((current-1+songs.length)%songs.length);
}
$('connect').onclick=connect;
$('play').onclick=playOnly;
$('pause').onclick=async()=>{if(player){await activate();try{await player.pause();playing=false;updateClock()}catch(e){}}};
$('stop').onclick=async()=>{if(player){await activate();try{await player.pause();await player.seek(0);playing=false;drawClock(0,lastDuration)}catch(e){}}};
$('prev').onclick=previousTrack;
$('next').onclick=nextTrack;
$('shuffle').onclick=async()=>{
 if(!await ensure()){await connect();return}
 try{
   shuffle=!shuffle;
   await api('/me/player/shuffle?state='+shuffle+(deviceId?'&device_id='+encodeURIComponent(deviceId):''),{method:'PUT'});
   $('shuffle').classList.toggle('active',shuffle);
   status(shuffle?'Spotify shuffle: PÅ':'Spotify shuffle: AV');
 }catch(e){shuffle=!shuffle;status('Shuffle: '+friendlySpotifyError(e.message))}
};
$('repeat').onclick=async()=>{
 if(!await ensure()){await connect();return}
 try{repeat=!repeat;await api('/me/player/repeat?state='+(repeat?'context':'off')+(deviceId?'&device_id='+encodeURIComponent(deviceId):''),{method:'PUT'});$('repeat').classList.toggle('active',repeat)}catch(e){repeat=!repeat}
};
$('volume').oninput=e=>{
 const v=+e.target.value;
 if(player)player.setVolume(v).catch(()=>{});
 clearTimeout(volumeTimer);
 volumeTimer=setTimeout(async()=>{
   try{await api('/me/player/volume?volume_percent='+Math.round(v*100)+(deviceId?'&device_id='+encodeURIComponent(deviceId):''),{method:'PUT'})}catch(x){}
 },120);
};
$('seek').addEventListener('pointerdown',async e=>{
 let r=$('seek').getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
 $('seekFill').style.width=p*100+'%';$('seekKnob').style.left=p*100+'%';
 if(player)try{let st=await player.getCurrentState();if(st){await player.seek(Math.round(st.duration*p));drawClock(st.duration*p,st.duration)}}catch(x){}
});
$('eqBtn').onclick=()=>toggleWin('eqWin');$('plBtn').onclick=()=>toggleWin('plWin');$('eqOn').onclick=()=>{eqOn=!eqOn;$('eqOn').classList.toggle('active',eqOn)};$('eqAuto').onclick=()=>{auto=!auto;$('eqAuto').classList.toggle('active',auto)};$('presets').onclick=()=>{let p=prompt('PRESETS: 1=Flat, 2=Rock, 3=Bass, 4=V');if(!p)return;let vals=p==='2'?[3,5,4,2,0,-1,2,4,5,3,2]:p==='3'?[6,5,4,2,1,0,0,1,2,2,2]:p==='4'?[5,3,2,0,-1,-2,2,4,5,5,4]:Array(11).fill(0);document.querySelectorAll('.eqrange').forEach((x,i)=>x.value=vals[i]);saveEq()};
$('eject').onclick=()=>{ $('searchbox').classList.toggle('show');$('searchInput').focus()};$('misc').onclick=()=>{$('searchbox').classList.toggle('show');$('searchInput').focus()};$('searchBtn').onclick=searchSpotify;$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchSpotify()});
async function searchSpotify(){
 let q=$('searchInput').value.trim();
 if(!q){status('Skriv inn artist eller låt først');return}
 try{
   if(!await ensure()){await connect();if(!token)return}
   let r=await api('/search?type=track&limit=10&market=NO&q='+encodeURIComponent(q));
   let items=(r.tracks&&r.tracks.items)||[];
   if(!items.length){status('Ingen treff på '+q);return}
   songs.length=0;playlistContextUri='';
   const addedBase=Date.now();
   items.forEach((t,n)=>songs.push([t.artists?.[0]?.name||'Ukjent',t.name,fmt(t.duration_ms),t.uri,addedBase+n]));
   songs.sort((a,b)=>(b[4]||0)-(a[4]||0));current=0;sortMode='added';renderPlaylist();status('Spotify-søk: '+items.length+' treff');
   
 }catch(e){status('Søk feilet: '+friendlySpotifyError(e.message))}
}
function friendlySpotifyError(msg){
 try{let d=JSON.parse(msg); if(d?.error?.message)return d.error.message; if(d?.error)return String(d.error)}catch(e){}
 if(String(msg).includes('400'))return 'Spotify avviste søket (limit/forespørsel)';
 if(String(msg).includes('401'))return 'Spotify-innloggingen er utløpt';
 if(String(msg).includes('403'))return 'Spotify nekter tilgang til denne forespørselen';
 if(String(msg).includes('429'))return 'For mange Spotify-forespørsler, prøv igjen om litt';
 return String(msg||'ukjent feil');
}

async function loadMyPlaylists(){
 try{
   if(!await ensure()){await connect();if(!token)return}
   $('playlistMenu').classList.add('show');$('playlistChoices').innerHTML='<div class="playlist-loading">Henter Spotify-spillelister...</div>';
   let all=[],offset=0;
   while(true){
     let r=await api('/me/playlists?limit=50&offset='+offset);
     let items=r.items||[]; all.push(...items);
     if(!r.next || !items.length)break;
     offset+=items.length;
   }
   $('playlistChoices').innerHTML='';
   if(!all.length){$('playlistChoices').innerHTML='<div class="playlist-loading">Ingen spillelister funnet.</div>';return}
   all.forEach(pl=>{
     let b=document.createElement('button');b.className='playlist-choice';b.textContent=pl.name||'(uten navn)';
     b.onclick=()=>loadPlaylist(pl.id,pl.name||'Spotify');$('playlistChoices').appendChild(b);
   });
 }catch(e){$('playlistChoices').innerHTML='<div class="playlist-loading">Kunne ikke hente spillelister.</div>';status('Spillelister: '+friendlySpotifyError(e.message))}
}
async function loadPlaylist(id,name){
 try{
   let all=[],offset=0;
   while(true){
     let r=await api('/playlists/'+encodeURIComponent(id)+'/items?limit=50&offset='+offset);
     let items=r.items||[]; all.push(...items);
     if(!r.next || !items.length)break;
     offset+=items.length;
   }
   songs.length=0;playlistContextUri='spotify:playlist:'+id;
   all.forEach((x,n)=>{
     let t=x.item||x.track;
     if(t && t.type==='track') songs.push([t.artists?.[0]?.name||'Ukjent',t.name,fmt(t.duration_ms),t.uri,x.added_at?Date.parse(x.added_at):Date.now()-n,n]);
   });
   songs.sort((a,b)=>(b[4]||0)-(a[4]||0));current=0;sortMode='added';renderPlaylist();$('playlistMenu').classList.remove('show');status('Lastet spilleliste: '+name+' • '+songs.length+' låter');
 }catch(e){status('Spilleliste: '+friendlySpotifyError(e.message))}
}
$('add').onclick=()=>{let n=prompt('Legg til artist - låt');if(!n)return;let parts=n.split(' - ');playlistContextUri='';songs.push([parts[0]||n,parts.slice(1).join(' - ')||'', '0:00','',Date.now()]);renderPlaylist()};
$('rem').onclick=()=>{if(!songs.length)return;songs.splice(current,1);current=Math.max(0,current-1);renderPlaylist()};
$('sort').onclick=sortPlaylist;
$('listopts').onclick=loadMyPlaylists;
$('closePlaylistMenu').onclick=()=>$('playlistMenu').classList.remove('show');

const SKINS=['classic','fusion','classicblue','sony','onegin','blue','neon','synth'];
function setSkin(mode,announce=true){
 const classes=['fusion','skin-classicblue','skin-sony','skin-onegin','skin-blue','skin-neon','skin-synth'];
 document.body.classList.remove(...classes);
 if(mode==='fusion')document.body.classList.add('fusion');
 if(mode==='classicblue')document.body.classList.add('skin-classicblue');
 if(mode==='sony')document.body.classList.add('skin-sony');
 if(mode==='onegin')document.body.classList.add('skin-onegin');
 if(mode==='blue')document.body.classList.add('skin-blue');
 if(mode==='neon')document.body.classList.add('skin-neon');
 if(mode==='synth')document.body.classList.add('skin-synth');
 localStorage.setItem('wa_skin',mode);
 $('skin').textContent='SKIN';
 if(announce)status('Skin: '+mode);
}
$('skin').onclick=()=>{const cur=localStorage.getItem('wa_skin')||'classic';const i=SKINS.indexOf(cur);setSkin(SKINS[(i+1)%SKINS.length]);};
setSkin(SKINS.includes(localStorage.getItem('wa_skin'))?localStorage.getItem('wa_skin'):'classic',false);
function toggleWin(id){$(id).classList.toggle('hidden')}
document.querySelectorAll('.win').forEach(w=>w.querySelectorAll('.winbtn').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='min')w.classList.toggle('collapsed');if(a==='max'){w.classList.remove('collapsed');w.classList.remove('hidden')}if(a==='close')w.classList.add('hidden')}));
callback();
</script>
